name: SH-3 CI

on:
  push:
    branches:
      - main
      - develop
      - v2.2-development
  pull_request:
    branches:
      - main
      - develop
      - v2.2-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and Quality Check (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff mypy

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Mypy
        run: python -m mypy . --explicit-package-bases

  required-checks:
    name: CI Required Checks
    if: always()
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform matrix job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "CI matrix did not pass: $TEST_RESULT" >&2
            exit 1
          fi
