name: SH-3 Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from foundation.version import PACKAGE_VERSION

          tag = os.environ.get("RELEASE_TAG", "").removeprefix("v")
          pattern = re.compile(r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$")
          if pattern.fullmatch(PACKAGE_VERSION) is None:
              raise SystemExit(f"Invalid package version: {PACKAGE_VERSION}")
          if os.environ.get("RELEASE_TAG", "").startswith("v") or os.environ.get("GITHUB_EVENT_NAME") == "release":
              if tag != PACKAGE_VERSION:
                  raise SystemExit(f"Release tag {tag!r} does not match package version {PACKAGE_VERSION!r}")
          print(f"Validated SH-3 package version: {PACKAGE_VERSION}")
          PY

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff mypy build

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Mypy
        run: python -m mypy . --explicit-package-bases

      - name: Build package
        run: python -m build

      - name: Validate build artifacts
        shell: bash
        run: |
          test -f dist/sh3-*.tar.gz
          test -f dist/sh3-*.whl
          python -m zipfile -l dist/sh3-*.whl | grep -E '^sh3dev/'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sh3-package
          path: dist/
          if-no-files-found: error

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
