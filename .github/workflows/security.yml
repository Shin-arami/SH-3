name: SH-3 Security

on:
  push:
    branches:
      - main
      - develop
      - v2.2-development
  pull_request:
    branches:
      - main
      - develop
      - v2.2-development
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install audit tool
        run: python -m pip install pip-audit

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

  required-checks:
    name: Security Required Checks
    if: always()
    needs:
      - codeql
      - dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require both security jobs to pass
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          if [ "$CODEQL_RESULT" != "success" ] || [ "$DEPENDENCY_RESULT" != "success" ]; then
            echo "Security checks did not pass: CodeQL=$CODEQL_RESULT, DependencyAudit=$DEPENDENCY_RESULT" >&2
            exit 1
          fi
