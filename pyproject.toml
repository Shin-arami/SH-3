[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sh3"
dynamic = ["version"]
description = "SH-3 AI Operating System Framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "SH-3 Development Team"}
]
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "foundation.version.PACKAGE_VERSION"}

[tool.setuptools.packages.find]
include = [
    "autonomy*",
    "cognition*",
    "foundation*",
    "infrastructure*",
    "runtime*",
    "kernel*",
    "persistence*",
    "services*",
    "self_healing*",
    "deployment*",
    "sh3dev*",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
pretty = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
